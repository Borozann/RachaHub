<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futsal Match — Matchmaking de Futsal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="pular" href="#principal">Pular para o conteúdo</a>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<header class="topbar glass" id="topbar">
  <a class="brand" href="#/" aria-label="Futsal Match — início">
    <span class="brand-icon" aria-hidden="true">⚽</span>
    <span class="brand-title">Futsal <span>Match</span></span>
  </a>
  <nav class="nav-desktop" id="navDesktop" aria-label="Principal"></nav>
  <div class="topbar-acoes">
    <button type="button" class="btn-icone" id="btnTema" aria-label="Alternar tema claro/escuro">
      <span aria-hidden="true">◐</span>
    </button>
    <button type="button" class="btn btn-sutil btn-pequeno" id="btnSair" hidden>
      <i class="fa-solid fa-right-from-bracket"></i> Sair
    </button>
  </div>
</header>

<main id="principal" tabindex="-1"></main>

<nav class="bottombar glass" id="navMobile" aria-label="Principal"></nav>

<dialog id="modal" class="modal glass"></dialog>
<div id="toasts" class="toasts" aria-live="polite" role="status"></div>

<script src="script.js"></script>
</body>
</html>
